<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSTAN - Jelajahi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">
  <div id="navigationContainer"></div>

  <main class="md:ml-64 min-h-screen pb-20 md:pb-0 flex justify-center">
    <div class="w-full max-w-xl px-4 py-6">
      <div id="exploreGrid" class="grid grid-cols-3 gap-1"></div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const posts = Storage.get(STORAGE_KEYS.POSTS) || [];
      const grid = document.getElementById('exploreGrid');
      grid.innerHTML = posts.map(p => `<div class="aspect-square bg-gray-150 overflow-hidden"><img src="${p.image}" class="w-full h-full object-cover"></div>`).join('');
    });
  </script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
