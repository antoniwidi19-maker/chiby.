<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSTAN - Profil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">
  <div id="navigationContainer"></div>

  <main class="md:ml-64 min-h-screen pb-20 md:pb-0 flex justify-center">
    <div class="w-full max-w-xl px-4 py-8">
      <div class="flex items-center gap-6 mb-8 bg-white border border-gray-200 p-6 rounded-2xl">
        <img id="profileAvatar" class="w-20 h-20 rounded-full object-cover" />
        <div class="flex-1">
          <div class="flex items-center justify-between mb-2">
            <h2 id="profileUsername" class="font-bold text-lg"></h2>
            <button onclick="openEditProfile()" class="border border-gray-300 px-4 py-1.5 rounded-xl text-xs font-semibold">Edit Profil</button>
          </div>
          <p id="profileFullName" class="font-semibold text-sm text-gray-600 mb-1"></p>
          <p id="profileBio" class="text-sm text-gray-500 mb-4"></p>
          <div class="flex gap-6 text-sm">
            <span><strong><span id="postCount">0</span></strong> postingan</span>
          </div>
        </div>
      </div>

      <div id="userPostsGrid" class="grid grid-cols-3 gap-1"></div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
