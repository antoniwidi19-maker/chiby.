<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSTAN - Masuk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white border border-gray-200 p-8 rounded-2xl max-w-sm w-full shadow-sm text-center">
    <h1 class="text-3xl font-bold tracking-wider mb-6 font-serif">INSTAN</h1>
    <div id="errorMsg" class="hidden bg-red-50 text-red-500 text-xs p-3 rounded-xl mb-4"></div>
    
    <form id="loginForm" class="space-y-4">
      <input type="text" id="identifier" placeholder="Username atau email" required class="w-full border rounded-xl p-3 text-sm focus:outline-none bg-gray-50" />
      <div class="relative">
        <input type="password" id="password" placeholder="Password" required class="w-full border rounded-xl p-3 text-sm focus:outline-none bg-gray-50 pr-16" />
        <button type="button" class="toggle-password absolute right-3 top-3 text-xs text-gray-400">Tampilkan</button>
      </div>
      <button type="submit" class="w-full bg-black text-white py-3 rounded-xl font-semibold text-sm">Masuk</button>
    </form>
    
    <p class="text-sm mt-6 text-gray-500">Belum punya akun? <a href="register.html" class="text-black font-semibold">Daftar</a></p>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
