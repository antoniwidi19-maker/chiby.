<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INSTAN - Notifikasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">
  <div id="navigationContainer"></div>

  <main class="md:ml-64 min-h-screen pb-20 md:pb-0 flex justify-center">
    <div class="w-full max-w-xl px-4 py-6">
      <h2 class="font-bold text-lg mb-4">Notifikasi</h2>
      <div id="notifList" class="space-y-3 bg-white border border-gray-200 rounded-2xl p-4"></div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const currentUser = Storage.getCurrentUser();
      const notifs = Storage.get(STORAGE_KEYS.NOTIFICATIONS) || [];
      const userNotifs = notifs.filter(n => n.userId === currentUser.id);
      const container = document.getElementById('notifList');

      if (userNotifs.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Tidak ada notifikasi.</p>';
        return;
      }

      container.innerHTML = userNotifs.reverse().map(n => `<div class="text-sm border-b pb-2 last:border-0">${n.text}</div>`).join('');
    });
  </script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
